<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | CoinvestAI</title>
    <meta name="robots" content="noindex, follow">

    <!-- Clean & Standard Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0F172A;
            --secondary: #2563EB;
            --accent: #22C55E;
            --text: #111827;
            --gray: #64748B;
            --light-gray: #f8fafc;
            --border: #e5e7eb;
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            color: var(--text);
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        /* Header / Logo */
        .brand-header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 26px;
            font-weight: 700;
            text-decoration: none;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main 404 Section */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 24px;
        }

        .error-card {
            max-width: 520px;
            width: 100%;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 110px;
            font-weight: 700;
            color: #f1f5f9;
            line-height: 1;
            margin-bottom: -20px;
            text-shadow: 1px 1px 0px var(--border);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--primary);
        }

        p {
            color: var(--gray);
            margin-bottom: 32px;
            font-size: 16px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--secondary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-outline {
            border: 1px solid var(--border);
            color: var(--text);
            background: white;
        }

        .btn-outline:hover {
            border-color: var(--secondary);
            color: var(--secondary);
            background: var(--light-gray);
        }

        /* Footer */
        .footer {
            background: var(--primary);
            color: white;
            padding: 24px 0;
            text-align: center;
            width: 100%;
            margin-top: auto;
        }

        .footer p {
            color: rgba(255, 255, 255, 0.45);
            font-size: 14px;
            margin-bottom: 0;
        }

        @media (max-width: 600px) {
            .error-code { font-size: 85px; }
            h1 { font-size: 26px; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>

    <!-- Google AdSense Code with defer -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7088247829787060" crossorigin="anonymous" defer></script>
</head>
<body>

    <header class="brand-header">
        <a href="index.html" class="logo">CoinvestAI</a>
    </header>

    <main class="main-content">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p>The page you are looking for may have been moved, renamed, or no longer exists in our database.</p>

            <div class="btn-group">
                <a href="index.html" class="btn btn-primary">Back to Home</a>
                <a href="blog.html" class="btn btn-outline">Read Articles</a>
                <a href="ai-tools.html" class="btn btn-outline">AI Tools Directory</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 CoinvestAI. All rights reserved.</p>
    </footer>

</body>
</html>
