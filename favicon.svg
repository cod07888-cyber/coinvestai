<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Subtle inner shadow ring -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Candlesticks / Growth Bars -->
  <!-- Bar 1 (Left / AI node base) -->
  <rect x="28" y="66" width="14" height="34" rx="4" fill="url(#bar1)"/>
  <line x1="35" y1="58" x2="35" y2="66" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="35" y1="100" x2="35" y2="106" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bar 2 (Middle / Analysis) -->
  <rect x="57" y="48" width="14" height="52" rx="4" fill="url(#bar2)"/>
  <line x1="64" y1="38" x2="64" y2="48" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="100" x2="64" y2="108" stroke="#0891B2" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bar 3 (Right / Peak Growth) -->
  <rect x="86" y="28" width="14" height="72" rx="4" fill="url(#bar3)"/>
  <line x1="93" y1="18" x2="93" y2="28" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="93" y1="100" x2="93" y2="108" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>

  <!-- AI Neural Network Dynamic Synapse Line -->
  <path d="M 35 58 Q 60 26 93 18" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 35 58 Q 60 26 93 18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Neural Connection Nodes -->
  <circle cx="35" cy="58" r="5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="64" cy="38" r="6" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="93" cy="18" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
</svg>